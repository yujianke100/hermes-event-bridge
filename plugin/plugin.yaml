# plugin.yaml — Hermes Event Bridge 通知插件
name: hermes-event-bridge
version: 1.0.0
description: 将 Hermes session 完成 / 授权请求事件主动外发到事件桥服务，推送给 Arcs-Mini 等物联网设备
author: yujianke100
manifest_version: 2
api_version: 1
license: MIT
hooks:
  - on_session_end
  - pre_approval_request
  - post_approval_response
config_schema:
  bridge_url:
    type: str
    default: "http://127.0.0.1:8788"
    description: "事件桥服务地址（Hermes 主动 POST /event 到此处）"
    required: true
  bridge_token:
    type: str
    default: ""
    description: "可选：事件桥鉴权 token（与 bridge.py --token 一致）"
    required: false
  notify_on:
    type: list
    default: ["session_end", "approval_request", "approval_response"]
    description: "要外发的事件类型列表"
    required: false