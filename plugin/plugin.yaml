# plugin.yaml — Hermes Event Bridge 导管插件
name: hermes-event-bridge
version: 1.3.0
description: 将 Hermes 生命周期 hook 事件转发到事件桥服务（智能判定在桥端），推送给 Arcs-Mini 等物联网设备；支持语音设置天气城市
author: yujianke100
manifest_version: 2
api_version: 1
license: MIT
hooks:
  - on_session_start
  - pre_llm_call
  - on_session_end
  - pre_approval_request
  - post_approval_response
config_schema:
  bridge_url:
    type: str
    default: "http://127.0.0.1:8788"
    description: "事件桥服务地址（Hermes 主动 POST /event 到此处）"
    required: true
  bridge_token:
    type: str
    default: ""
    description: "可选：事件桥鉴权 token（与 bridge.py --token 一致）"
    required: false